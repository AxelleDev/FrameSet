<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FrameSet — The graphic reference for your projects</title>
  <meta name="description" content="FrameSet keeps every project's graphic standards and color palette in one place.">
  <link rel="icon" type="image/png" href="/FrameSet_Favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#8994DF">
  <link rel="canonical" href="https://frameset.app/">
  <!-- Open Graph (defaults; overridden per-page client-side via the <Seo> component) -->
  <meta property="og:site_name" content="FrameSet">
  <meta property="og:type" content="website">
  <meta property="og:title" content="FrameSet — The graphic reference for your projects">
  <meta property="og:description" content="FrameSet keeps every project's graphic standards and color palette in one place.">
  <meta property="og:url" content="https://frameset.app/">
  <meta property="og:image" content="https://frameset.app/FrameSet_Logo.png">
  <meta property="og:locale" content="en_US">
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="FrameSet — The graphic reference for your projects">
  <meta name="twitter:description" content="FrameSet keeps every project's graphic standards and color palette in one place.">
  <meta name="twitter:image" content="https://frameset.app/FrameSet_Logo.png">
  <script>
    // Apply the saved/preferred theme before paint to avoid a flash of the wrong theme.
    (function () {
      try {
        var t = localStorage.getItem('frameset-theme');
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (t === 'dark') document.documentElement.classList.add('dark');
      } catch (e) { /* ignore */ }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
