<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FrameSet — The graphic reference for your projects</title>
    <meta
      name="description"
      content="FrameSet keeps every project's graphic standards and color palette in one place."
    />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/Figtree.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#8994DF" />
    <!-- Installed-app (PWA) hints for iOS, which ignores parts of the manifest.
         The standard mobile-web-app-capable rides along: Chrome deprecates the
         apple- prefixed one on its own and warns without it. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FrameSet" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="canonical" href="https://frameset-taupe.vercel.app/" />
    <!-- Open Graph (defaults; overridden per-page client-side via the <Seo> component) -->
    <meta property="og:site_name" content="FrameSet" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FrameSet — The graphic reference for your projects" />
    <meta
      property="og:description"
      content="FrameSet keeps every project's graphic standards and color palette in one place."
    />
    <meta property="og:url" content="https://frameset-taupe.vercel.app/" />
    <meta property="og:image" content="https://frameset-taupe.vercel.app/og-cover.png" />
    <meta property="og:locale" content="en_US" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FrameSet — The graphic reference for your projects" />
    <meta
      name="twitter:description"
      content="FrameSet keeps every project's graphic standards and color palette in one place."
    />
    <meta name="twitter:image" content="https://frameset-taupe.vercel.app/og-cover.png" />
    <!-- Applied before paint (blocking, in <head>) to avoid a theme flash. External
       file so a strict CSP `script-src 'self'` covers it without an inline hash. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
